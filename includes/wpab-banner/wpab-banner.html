#wpab-banner-host { clear: both; margin: 20px 20px 0 2px; }
#wpab-banner-host[hidden] { display: none !important; }
.wpab-bfs { --green: #1ff2a1; --yellow: #ffff00; position: relative; container: wpabbfs / inline-size; height: 100px; overflow: hidden; color: #fff; border-radius: 8px; box-sizing: border-box;
  background:
    radial-gradient(120px 80px at 46% 0, rgba(0, 210, 90, .95), transparent 78%),
    radial-gradient(240px 150px at 45.6% 10px, rgba(0, 160, 80, .7), transparent 72%),
    radial-gradient(420px 150px at 66% 10px, rgba(0, 135, 128, .9), transparent 78%),
    radial-gradient(600px 170px at 57% 90px, rgba(0, 90, 92, .8), transparent 80%),
    linear-gradient(90deg, #001626 0%, #001a2a 26%, #00384a 46%, #005a5e 62%, #004f56 76%, #00222f 92%, #000f1b 100%); }
.wpab-bfs *, .wpab-bfs *::before, .wpab-bfs *::after { box-sizing: border-box; }
.wpab-bfs::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(122deg, transparent 0 46%, rgba(0, 30, 40, .55) 46.2%, transparent 58%); mix-blend-mode: multiply; }
.wpab-bfs .wpab-grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .2; mix-blend-mode: overlay; pointer-events: none; }
.wpab-bfs .wpab-in { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; gap: 33px; padding: 0 56px 0 16px; }
.wpab-bfs .wpab-hero { display: flex; align-items: center; flex: none; margin: 0; padding: 0; }
.wpab-bfs .wpab-letters { position: relative; width: 167px; height: 73px; margin-right: 22px; flex: none; }
.wpab-bfs .wpab-bf { position: absolute; max-width: none; max-height: none; overflow: visible; pointer-events: none; }
.wpab-bfs .wpab-bf-o { fill: rgba(255, 255, 255, .32); }
.wpab-bfs .wpab-bf-s { fill: #fff; }
.wpab-bfs .wpab-70 { font: 800 75px/1 "WPAB Unbounded", sans-serif; letter-spacing: -.045em; color: var(--green); margin-top: 2px; }
.wpab-bfs .wpab-pct { font: 500 57px/1 "WPAB Sora", sans-serif; margin: 0 6px 0 10px; color: #fff; }
.wpab-bfs .wpab-off { font: 800 23px/1 "WPAB Unbounded", sans-serif; letter-spacing: .02em; color: var(--green); writing-mode: vertical-rl; transform: rotate(180deg); }
.wpab-bfs .wpab-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wpab-bfs .wpab-plugins { display: flex; gap: 4px; margin: 0; padding: 0; list-style: none; flex: none; }
.wpab-bfs .wpab-plugins li { width: 48px; height: 48px; margin: 0; padding: 0; }
.wpab-bfs .wpab-plugins svg { display: block; width: 100%; height: 100%; }
.wpab-bfs a.wpab-cta { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 190px; height: 54px; border-radius: 999px; background: var(--yellow); color: #111;
  font: 700 19.5px/1 "WPAB Inter", system-ui, sans-serif; text-decoration: none; cursor: pointer; box-shadow: none; transition: background-color .15s ease; }
.wpab-bfs a.wpab-cta:hover, .wpab-bfs a.wpab-cta:focus { background: #fff; color: #111; box-shadow: none; }
.wpab-bfs a.wpab-cta:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.wpab-bfs button.wpab-x { position: absolute; top: 50%; right: 12px; width: 32px; height: 32px; margin: -16px 0 0; padding: 0; border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center; opacity: .8; transition: background-color .15s ease, opacity .15s ease; }
.wpab-bfs button.wpab-x:hover, .wpab-bfs button.wpab-x:focus { background: rgba(255, 255, 255, .16); opacity: 1; box-shadow: none; }
.wpab-bfs button.wpab-x:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.wpab-bfs button.wpab-x svg { width: 16px; height: 16px; display: block; }
@container wpabbfs (max-width: 1120px) { .wpab-bfs .wpab-in { gap: 24px; } .wpab-bfs .wpab-plugins li { width: 40px; height: 40px; } }
@container wpabbfs (max-width: 1040px) { .wpab-bfs .wpab-plugins li:nth-child(n+6) { display: none; } }
@container wpabbfs (max-width: 900px) { .wpab-bfs .wpab-plugins { display: none; } }
@container wpabbfs (max-width: 690px) {
  .wpab-bfs .wpab-in { gap: 14px; padding-right: 48px; }
